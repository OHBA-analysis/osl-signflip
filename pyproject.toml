[build-system]
requires = ["hatchling>=1.27", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "osl-signflip"
dynamic = ["version"]
description = "Fast, reproducible sign-flipping for source-reconstructed M/EEG parcel time series via Z2 synchronisation."
readme = "src/README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "SungJun Cho", email = "sungjun.cho@ndcn.ox.ac.uk" }]
keywords = [
    "MEG",
    "EEG",
    "source reconstruction",
    "dipole sign ambiguity",
    "sign flipping",
    "Z2 synchronization",
    "semidefinite programming",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = ["numpy>=1.20", "tqdm"]

[project.optional-dependencies]
mne = ["mne>=1.0"]
dev = ["pytest", "ruff"]
all = ["osl_signflip[mne,dev]"]

[project.urls]
Homepage = "https://github.com/OHBA-analysis/osl-signflip"
Issues = "https://github.com/OHBA-analysis/osl-signflip/issues"

# The version number is derived automatically from git tags (e.g. v0.1.0 -> 0.1.0)
[tool.hatch.version]
source = "vcs"

# Only the package goes into the wheel/sdist; the paper pipeline (scripts/, manuscript/, data) stays out.
[tool.hatch.build.targets.wheel]
packages = ["src/osl_signflip"]

[tool.hatch.build.targets.sdist]
only-include = ["src", "tests", "LICENSE", "pyproject.toml", "CITATION.cff"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 90
src = ["src"]
include = ["src/**/*.py", "tests/**/*.py"]
